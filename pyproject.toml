[project]
name = "__PROJECT_SLUG__"
version = "0.1.0"
description = "__PROJECT_TITLE__"
readme = "README.md"
requires-python = ">=3.12,<3.14"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pyright>=1.1.380",
]

[tool.uv.workspace]
members = ["api"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["app", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]

[tool.pyright]
include = ["api/src", "api/tests"]
pythonVersion = "3.12"
reportMissingImports = "warning"
