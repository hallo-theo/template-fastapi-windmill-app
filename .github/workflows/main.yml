name: Main

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The very first push in a repo created from this template is GitHub's own
  # template copy — placeholders still present, pyproject.toml not even valid
  # TOML. Deploying that is impossible, and the guaranteed red run it produces
  # teaches people to ignore red. Gate deploy on bootstrap having happened.
  bootstrapped:
    if: github.repository != 'hallo-theo/template-fastapi-windmill-app'
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - uses: actions/checkout@v5
      - id: check
        run: |
          # bootstrap.sh self-deletes, so its presence marks GitHub's raw
          # template copy. NEVER key this check on a __PLACEHOLDER__ literal:
          # bootstrap substitutes those in THIS file too, which inverted the
          # guard into grep-for-the-slug (always true) and silently skipped
          # every deploy of every newborn repo (found on beschluss-radar).
          if [ -f scripts/bootstrap.sh ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "Pre-bootstrap template copy — skipping deploy (expected on the initial commit)."
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: bootstrapped
    # Skip on the template repo itself — placeholder values in `with:` aren't
    # real resources. Adopters' repos have a different name and run normally.
    if: github.repository != 'hallo-theo/template-fastapi-windmill-app' && needs.bootstrapped.outputs.ok == 'true'
    # Permissions must live at the JOB level for the reusable workflow's
    # nested jobs to inherit them. Workflow-level doesn't propagate.
    permissions:
      id-token: write
      contents: read
    uses: hallo-theo/.github/.github/workflows/python-ts-deploy.yml@main
    with:
      gcp-project-id:         __GCP_PROJECT__
      gcp-project-number:     "__GCP_PROJECT_NUMBER__"
      gcp-region:             __GCP_REGION__
      wif-provider-name:      __PROJECT_SLUG__
      deploy-sa:              __PROJECT_SLUG__-deploy@__GCP_PROJECT__.iam.gserviceaccount.com
      cloud-run-service:      __CLOUD_RUN_SERVICE__
      artifact-registry-repo: __ARTIFACT_REGISTRY_REPO__
      image-name:             api
      dockerfile:             api/Dockerfile
      docker-context:         .
      api-path:               api
      api-package:            __PYTHON_PACKAGE__
      app-path:               app/__PROJECT_SLUG__.raw_app
      wmill-workspace:        __WMILL_WORKSPACE__
      wmill-app-path:         __WMILL_APP_PATH__
      wmill-base-url:         __WMILL_BASE_URL__
    # No `secrets:` block. The Windmill CI token lives in GCP Secret Manager
    # (hallotheo-wmill-token) and is fetched at runtime by the deploy SA via
    # the WIF id-token — see hallo-theo/.github README.
