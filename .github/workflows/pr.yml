name: PR

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ci:
    # Skip on the template repo itself — its files contain __PLACEHOLDER__
    # tokens that aren't valid identifiers, so lint/test would always fail.
    # Adopters' repos have a different name and run normally.
    if: github.repository != 'hallo-theo/template-fastapi-windmill-app'
    uses: hallo-theo/.github/.github/workflows/python-ts-pr.yml@main
    with:
      api-path: api
      api-package: __PYTHON_PACKAGE__
      app-path: app/__PROJECT_SLUG__.raw_app
      terraform-path: terraform
      dockerfile: api/Dockerfile

  # The one required check for this repo — the whole org requires this same
  # name, which is what lets one org-level ruleset gate every repository.
  # Full rationale: hallo-theo/.github → sdlc/README.md.
  #
  # If you add a job to this file, add it to `needs` too, or it gates nothing.
  # Never add `paths:` filters to the `pull_request:` trigger above — the
  # workflow would not run, this check would never report, and every PR would
  # sit on "Expected — waiting for status" forever.
  gates-passed:
    needs: [ci]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Assert every gate ended in success or skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          # `skipped` passes — that is the paths-filter doing its job, and a
          # component whose code was untouched has nothing to prove. On the
          # template repo itself `ci` is skipped by design, so this passes.
          # `cancelled` FAILS: the run was interrupted, so the gate never
          # actually ran and must not be reported as green.
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.value.result)\t\(.key)"' | sort
          bad="$(echo "$NEEDS" | jq -r '
            to_entries[]
            | select(.value.result != "success" and .value.result != "skipped")
            | .key')"
          if [ -n "$bad" ]; then
            echo "::error::Gate failed. Jobs not in {success, skipped}:"
            echo "$bad" | while read -r j; do echo "::error::  $j"; done
            exit 1
          fi
          echo "All gates passed."

  # Automerge default-on (pitch-owner decision 2026-09-03): arms auto-merge on
  # every PR; it merges when gates-passed + CI are green. Carve-outs live in
  # the reusable workflow (untrusted-origin branches; .github/** edits).
  auto-merge:
    permissions:
      contents: write
      pull-requests: write
    uses: hallo-theo/.github/.github/workflows/auto-merge-eligible.yml@main
    secrets:
      # Armer identity — merges as theo-pr-reviewer[bot] so push workflows
      # (deploy!) fire; github.token merges are skipped by GitHub.
      PR_REVIEWER_PRIVATE_KEY: ${{ secrets.PR_REVIEWER_PRIVATE_KEY }}
